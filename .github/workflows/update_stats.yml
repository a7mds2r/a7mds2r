name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - "generate_github_stats.py"
      - "requirements.txt"
      - ".github/workflows/update_stats.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit stats image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate stats image
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: a7mds2r
          OUTPUT_PATH: assets/github_stats.png
        run: python generate_github_stats.py

      - name: Commit and push generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github_stats.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub stats image"
            git push
          fi
